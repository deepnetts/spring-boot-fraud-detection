spring:
  application:
    name: fraud-detection

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

fraud:
  model:
    # Where the trained network (.dnet) and its metadata (scaler, metrics) are stored
    dir: ./model
    # Train a model on startup when none is found in `dir`
    train-if-missing: true
    # Probability above which a transaction is flagged as fraud
    threshold: 0.5
  training:
    # Synthetic transactions generated for training + evaluation
    samples: 20000
    # Share of fraudulent transactions in the generated data (real-world fraud is rare)
    fraud-rate: 0.03
    # Fraction of data held out for evaluation (kept at the natural fraud rate)
    test-fraction: 0.25
    # Fraud examples are oversampled in the training split up to this share
    target-fraud-share: 0.3
    hidden-layers: [32, 16]
    max-epochs: 15
    learning-rate: 0.001
    l2-regularization: 0.0001
    seed: 42
