# Labelled transactions, one row per transaction. The last column, fraud, is 1 for fraud and 0 otherwise
fraud.training-data=data/train.csv
fraud.test-data=data/test.csv

# Where the trained network is saved. Delete this file to train a new model on the next start
fraud.model-file=model/fraud-model.dnet

# Fraud score at or above which a transaction is flagged
fraud.threshold=0.5

# Errors as standard problem details (RFC 9457)
spring.mvc.problemdetails.enabled=true

# Reject a decimal number for a whole-number field, such as 13.7 for hourOfDay, instead of cutting it to 13
spring.jackson.deserialization.accept-float-as-int=false
