spring:
  application:
    name: fraud-detection

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # Show the `model` status in /actuator/health
      show-components: always
      group:
        readiness:
          # Not ready to receive traffic until a model is loaded
          include: readinessState,model

fraud:
  data:
    # Where training data comes from: synthetic (generated, the default) or csv
    source: synthetic
    # The file to train on when source is csv. See "Train on your own data" in the README
    csv-path: data/sample-transactions.csv
  model:
    # Folder holding the trained model (fraud-model.bin: weights, scaler, metrics)
    dir: ./model
    # Train a model on startup when none is found in `dir`
    train-if-missing: true
    # Fraud score at or above which a transaction is flagged. Scores are not calibrated probabilities
    # TODO(customize): choose this from your own cost of missed fraud against false alarms
    threshold: 0.5
  training:
    # Synthetic transactions generated for training + evaluation
    samples: 12000
    # Share of fraudulent transactions in the generated data. Set high for a quick demo: real card fraud is much rarer
    fraud-rate: 0.03
    # Fraction of data held out for the final evaluation (kept at the natural fraud rate)
    test-fraction: 0.25
    # Fraction of data held out for choosing the recommended threshold (kept at the natural fraud rate)
    validation-fraction: 0.15
    hidden-layers: [32, 16]
    max-epochs: 15
    learning-rate: 0.001
    l2-regularization: 0.0001
    seed: 42
  retraining:
    # Scheduled retraining, e.g. "0 0 3 * * *" for 03:00 every day; "-" turns it off.
    # Retraining only helps when new labelled data has arrived (see "Retraining" in the README)
    cron: "-"
    # The new model replaces the active one only if its PR AUC on the same test rows is at most this much lower
    quality-tolerance: 0.01
